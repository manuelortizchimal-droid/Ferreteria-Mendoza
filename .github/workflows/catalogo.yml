name: Publicar catálogo central
on:
  workflow_dispatch:
  push:
    paths:
      - 'catalogo/productos.csv'
jobs:
  catalogo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Convertir CSV verificado a JSON
        run: python3 scripts/build_catalog.py
      - name: Publicar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/productos.json
          git diff --cached --quiet || (git commit -m "Actualizar catálogo central" && git push)
